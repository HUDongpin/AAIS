name: AAIS Preview E2E

on:
  deployment_status:

permissions:
  contents: read
  deployments: read
  pull-requests: read
  actions: read

jobs:
  trust-preview:
    if: >
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - name: Stage A - attest GitHub deployment
        id: github-trust
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const OWNER = "HUDongpin";
            const REPO = "AAIS";
            const REPOSITORY = "HUDongpin/AAIS";
            const DEFAULT_BRANCH = "main";
            const PR_NUMBER = 5;
            const RECOVERY_REF = "codex/aais-recovery-compose";
            const WORKFLOW_PATH = ".github/workflows/preview-e2e.yml";
            const WORKFLOW_LOCATION = "HUDongpin/AAIS/.github/workflows/preview-e2e.yml";
            const WORKFLOW_ID = 309746229;
            const MAX_INPUT_LENGTH = 512;
            const VERCEL_APP = {
              login: "vercel[bot]",
              id: 35613825,
              node_id: "MDM6Qm90MzU2MTM4MjU=",
              type: "Bot",
            };
            const isObject = (value) => value !== null
              && typeof value === "object"
              && !Array.isArray(value);
            const safeString = (value) => typeof value === "string"
              && value.length > 0
              && value.length <= MAX_INPUT_LENGTH
              && !/[\u0000-\u001f\u007f]/u.test(value);
            const fullSha = (value) => safeString(value) && /^[a-f0-9]{40}$/.test(value);
            const positiveInteger = (value) => Number.isSafeInteger(value) && value > 0;
            const positiveIdString = (value) => safeString(value)
              && /^[1-9][0-9]*$/.test(value)
              && Number.isSafeInteger(Number(value));
            const usableActor = (actor) => isObject(actor)
              && safeString(actor.login)
              && positiveInteger(actor.id)
              && safeString(actor.node_id)
              && safeString(actor.type);
            const isVercelApp = (actor) => isObject(actor)
              && actor.login === VERCEL_APP.login
              && actor.id === VERCEL_APP.id
              && actor.node_id === VERCEL_APP.node_id
              && actor.type === VERCEL_APP.type;
            const classifySha = (value, mainSha, prSha) => {
              if (!fullSha(value)) return "INVALID";
              if (!fullSha(mainSha) || !fullSha(prSha)) return "REFERENCE_FACTS_UNAVAILABLE";
              if (value === mainSha && value === prSha) return "MAIN_AND_PR_HEAD";
              if (value === mainSha) return "MAIN_TIP";
              if (value === prSha) return "PR_HEAD";
              return "OTHER_SHA";
            };
            const classifyWorkflowRef = (value, mainSha, prSha) => {
              if (!safeString(value)) return "INVALID";
              const firstAt = value.indexOf("@");
              if (firstAt <= 0 || firstAt !== value.lastIndexOf("@")) return "INVALID";
              const location = value.slice(0, firstAt);
              const suffix = value.slice(firstAt + 1);
              if (!safeString(location)
                || !safeString(suffix)
                || !/^[^/@\s]+\/[^/@\s]+\/[^/@\s]+(?:\/[^/@\s]+)*$/.test(location)) {
                return "INVALID";
              }
              if (location !== WORKFLOW_LOCATION) return "OTHER_REPOSITORY_OR_PATH";
              if (suffix === "refs/heads/main") return "MAIN_BRANCH";
              if (suffix === "refs/heads/" + RECOVERY_REF) return "RECOVERY_BRANCH";
              if (fullSha(suffix)) {
                if (!fullSha(mainSha) || !fullSha(prSha)) return "REFERENCE_FACTS_UNAVAILABLE";
                if (suffix === mainSha && suffix === prSha) {
                  return "MAIN_AND_PR_HEAD_SHA_LITERAL";
                }
                if (suffix === mainSha) return "MAIN_SHA_LITERAL";
                if (suffix === prSha) return "PR_HEAD_SHA_LITERAL";
                return "OTHER_SHA_LITERAL";
              }
              return "SAME_REPO_PATH_OTHER_REF";
            };
            const classifyDeploymentRef = (value, mainSha, prSha) => {
              if (!safeString(value)) return "INVALID";
              if (fullSha(value)) {
                if (!fullSha(mainSha) || !fullSha(prSha)) return "REFERENCE_FACTS_UNAVAILABLE";
                if (value === mainSha && value === prSha) return "MAIN_AND_PR_HEAD_SHA";
                if (value === prSha) return "PR_HEAD_SHA";
                if (value === mainSha) return "MAIN_TIP_SHA";
                return "OTHER_SHA";
              }
              if (value === RECOVERY_REF) return "RECOVERY_BRANCH";
              if (value === DEFAULT_BRANCH) return "MAIN_BRANCH";
              return "OTHER_REF";
            };
            const normalizeWorkflowFile = (data) => {
              if (!isObject(data)
                || data.type !== "file"
                || data.path !== WORKFLOW_PATH
                || !fullSha(data.sha)
                || !Number.isSafeInteger(data.size)
                || data.size < 0
                || data.encoding !== "base64"
                || typeof data.content !== "string") {
                return undefined;
              }
              let compact = data.content;
              if (compact.includes("\r") || /[ \t]/.test(compact)) return undefined;
              if (compact.includes("\n")) {
                const terminalLf = compact.endsWith("\n");
                const lines = compact.split("\n");
                if (terminalLf) lines.pop();
                if (lines.length === 0
                  || lines.some((line) => line.length === 0)
                  || (lines.length === 1 && (!terminalLf || lines[0].length > 60))
                  || (lines.length > 1
                    && (lines.slice(0, -1).some((line) => line.length !== 60)
                      || lines[lines.length - 1].length > 60))) {
                  return undefined;
                }
                compact = lines.join("");
              }
              if (compact.length % 4 !== 0
                || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(compact)) {
                return undefined;
              }
              let bytes;
              try {
                bytes = Buffer.from(compact, "base64");
              } catch {
                return undefined;
              }
              if (bytes.length !== data.size || bytes.toString("base64") !== compact) {
                return undefined;
              }
              return { sha: data.sha, bytes };
            };
            const sameWorkflowFile = (left, right) => left.sha === right.sha
              && Buffer.compare(left.bytes, right.bytes) === 0;
            const classifyWorkflowFiles = (source, main, pr) => {
              if (!source || !main || !pr) return "UNAVAILABLE";
              const sourceMain = sameWorkflowFile(source, main);
              const sourcePr = sameWorkflowFile(source, pr);
              const mainPr = sameWorkflowFile(main, pr);
              if (sourceMain && sourcePr && mainPr) return "ALL_EQUAL";
              if (sourceMain) return "SOURCE_MAIN_ONLY";
              if (sourcePr) return "SOURCE_PR_ONLY";
              if (mainPr) return "MAIN_PR_ONLY";
              return "ALL_DIFFERENT";
            };
            const facts = {
              repository: false,
              main: false,
              workflow: false,
              pr: false,
              run: false,
              deployment: false,
              deploymentStatus: false,
              sourceFile: false,
              mainFile: false,
              prFile: false,
            };
            const attempt = async (key, operation, validator) => {
              try {
                const value = await operation();
                if (!validator(value)) return undefined;
                facts[key] = true;
                return value;
              } catch {
                return undefined;
              }
            };
            const fetchWorkflowFile = async (key, ref) => {
              if (!fullSha(ref)) return undefined;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: OWNER,
                  repo: REPO,
                  path: WORKFLOW_PATH,
                  ref,
                });
                const normalized = normalizeWorkflowFile(data);
                if (!normalized) return undefined;
                facts[key] = true;
                return normalized;
              } catch {
                return undefined;
              }
            };
            let workflowRefClass = "INVALID";
            let workflowShaClass = "INVALID";
            let githubShaClass = "INVALID";
            let deploymentRefClass = "INVALID";
            let workflowBlobsClass = "UNAVAILABLE";
            let runBindingClass = "UNAVAILABLE";
            let apiFactsClass = "UNAVAILABLE";
            try {
              const repository = await attempt(
                "repository",
                async () => (await github.rest.repos.get({ owner: OWNER, repo: REPO })).data,
                (value) => isObject(value)
                  && value.full_name === REPOSITORY
                  && value.default_branch === DEFAULT_BRANCH,
              );
              const mainRef = await attempt(
                "main",
                async () => (await github.rest.git.getRef({
                  owner: OWNER,
                  repo: REPO,
                  ref: "heads/" + DEFAULT_BRANCH,
                })).data,
                (value) => isObject(value)
                  && value.ref === "refs/heads/" + DEFAULT_BRANCH
                  && isObject(value.object)
                  && value.object.type === "commit"
                  && fullSha(value.object.sha),
              );
              const workflow = await attempt(
                "workflow",
                async () => (await github.rest.actions.getWorkflow({
                  owner: OWNER,
                  repo: REPO,
                  workflow_id: WORKFLOW_ID,
                })).data,
                (value) => isObject(value)
                  && value.id === WORKFLOW_ID
                  && value.path === WORKFLOW_PATH
                  && value.state === "active",
              );
              const pullRequest = await attempt(
                "pr",
                async () => (await github.rest.pulls.get({
                  owner: OWNER,
                  repo: REPO,
                  pull_number: PR_NUMBER,
                })).data,
                (value) => isObject(value)
                  && value.number === PR_NUMBER
                  && value.state === "open"
                  && isObject(value.base)
                  && value.base.ref === DEFAULT_BRANCH
                  && value.base.repo?.full_name === REPOSITORY
                  && isObject(value.head)
                  && value.head.ref === RECOVERY_REF
                  && value.head.repo?.full_name === REPOSITORY
                  && fullSha(value.head.sha),
              );
              const mainSha = mainRef?.object?.sha;
              const prSha = pullRequest?.head?.sha;
              const contextRunId = positiveInteger(context.runId)
                ? context.runId
                : undefined;
              const workflowRun = await attempt(
                "run",
                async () => contextRunId
                  ? (await github.rest.actions.getWorkflowRun({
                    owner: OWNER,
                    repo: REPO,
                    run_id: contextRunId,
                  })).data
                  : undefined,
                (value) => isObject(value)
                  && positiveInteger(value.id)
                  && safeString(value.event)
                  && positiveInteger(value.workflow_id)
                  && safeString(value.path)
                  && safeString(value.head_branch)
                  && fullSha(value.head_sha)
                  && isObject(value.repository)
                  && safeString(value.repository.full_name)
                  && usableActor(value.actor)
                  && usableActor(value.triggering_actor),
              );
              const eventDeployment = context.payload && context.payload.deployment;
              const eventStatus = context.payload && context.payload.deployment_status;
              const eventDeploymentId = positiveInteger(eventDeployment?.id)
                ? eventDeployment.id
                : undefined;
              const eventStatusId = positiveInteger(eventStatus?.id)
                ? eventStatus.id
                : undefined;
              const deployment = await attempt(
                "deployment",
                async () => eventDeploymentId
                  ? (await github.rest.repos.getDeployment({
                    owner: OWNER,
                    repo: REPO,
                    deployment_id: eventDeploymentId,
                  })).data
                  : undefined,
                (value) => isObject(value)
                  && value.id === eventDeploymentId
                  && safeString(value.ref)
                  && fullSha(value.sha)
                  && usableActor(value.creator),
              );
              const deploymentStatus = await attempt(
                "deploymentStatus",
                async () => eventDeploymentId && eventStatusId
                  ? (await github.rest.repos.getDeploymentStatus({
                    owner: OWNER,
                    repo: REPO,
                    deployment_id: eventDeploymentId,
                    status_id: eventStatusId,
                  })).data
                  : undefined,
                (value) => isObject(value)
                  && value.id === eventStatusId
                  && safeString(value.state)
                  && usableActor(value.creator),
              );
              const sourceFile = await fetchWorkflowFile(
                "sourceFile",
                process.env.GITHUB_WORKFLOW_SHA,
              );
              const mainFile = await fetchWorkflowFile("mainFile", mainSha);
              const prFile = await fetchWorkflowFile("prFile", prSha);
              workflowRefClass = classifyWorkflowRef(
                process.env.GITHUB_WORKFLOW_REF,
                mainSha,
                prSha,
              );
              workflowShaClass = classifySha(
                process.env.GITHUB_WORKFLOW_SHA,
                mainSha,
                prSha,
              );
              githubShaClass = classifySha(process.env.GITHUB_SHA, mainSha, prSha);
              deploymentRefClass = classifyDeploymentRef(deployment?.ref, mainSha, prSha);
              workflowBlobsClass = classifyWorkflowFiles(sourceFile, mainFile, prFile);
              const envRunId = positiveIdString(process.env.GITHUB_RUN_ID)
                ? Number(process.env.GITHUB_RUN_ID)
                : undefined;
              const contextEventUsable = safeString(context.eventName);
              const contextRepositoryUsable = safeString(context.repo?.owner)
                && safeString(context.repo?.repo);
              if (workflowRun
                && fullSha(prSha)
                && contextRunId
                && envRunId
                && contextEventUsable
                && contextRepositoryUsable) {
                runBindingClass = workflowRun.id === contextRunId
                  && envRunId === contextRunId
                  && context.eventName === "deployment_status"
                  && context.repo.owner === OWNER
                  && context.repo.repo === REPO
                  && workflowRun.event === "deployment_status"
                  && workflowRun.workflow_id === WORKFLOW_ID
                  && workflowRun.path === WORKFLOW_PATH
                  && workflowRun.repository.full_name === REPOSITORY
                  && workflowRun.head_branch === RECOVERY_REF
                  && workflowRun.head_sha === prSha
                  && isVercelApp(workflowRun.actor)
                  && isVercelApp(workflowRun.triggering_actor)
                  ? "EXACT"
                  : "MISMATCH";
              }
              const factValues = Object.values(facts);
              const usableFactCount = factValues.filter(Boolean).length;
              apiFactsClass = usableFactCount === factValues.length
                ? "COMPLETE"
                : usableFactCount === 0
                  ? "UNAVAILABLE"
                  : "PARTIAL";
              void repository;
              void workflow;
              void deploymentStatus;
            } catch {
              // Fixed defaults below are the only permitted failure observation.
            }
            console.log([
              "AAIS_PREVIEW_CONTEXT_DIAG",
              "WORKFLOW_REF=" + workflowRefClass,
              "WORKFLOW_SHA=" + workflowShaClass,
              "GITHUB_SHA=" + githubShaClass,
              "DEPLOYMENT_REF=" + deploymentRefClass,
              "WORKFLOW_BLOBS=" + workflowBlobsClass,
              "RUN_BINDING=" + runBindingClass,
              "API_FACTS=" + apiFactsClass,
            ].join(" "));
            throw new Error("AAIS_PREVIEW_CONTEXT_DIAGNOSTIC_STOP");

      - name: Stage B - attest Vercel deployment
        if: ${{ false }}
        id: vercel-trust
        env:
          VERCEL_E2E_METADATA_TOKEN: ${{ secrets.VERCEL_E2E_METADATA_TOKEN }}
          VERCEL_HOSTNAME: ${{ steps.github-trust.outputs.vercel_hostname }}
          ATTESTED_SHA: ${{ steps.github-trust.outputs.attested_sha }}
          GITHUB_DEPLOYMENT_ID: ${{ steps.github-trust.outputs.github_deployment_id }}
          GITHUB_DEPLOYMENT_STATUS_ID: ${{ steps.github-trust.outputs.github_deployment_status_id }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const token = process.env.VERCEL_E2E_METADATA_TOKEN;
          if (!token) {
            console.error("AAIS_PREVIEW_TRUST_METADATA_TOKEN_ABSENT");
            process.exit(1);
          }
          const fail = () => {
            throw new Error("AAIS_PREVIEW_TRUST_METADATA_RESPONSE");
          };
          const isString = (value) => typeof value === "string" && value.length > 0;
          const isObject = (value) => value !== null
            && typeof value === "object"
            && !Array.isArray(value);
          const hasOwn = (value, key) => Object.prototype.hasOwnProperty.call(value, key);
          const exactKeys = (value, keys) => isObject(value)
            && Object.keys(value).length === keys.length
            && keys.every((key) => hasOwn(value, key));
          const validateDeploymentShape = (deployment) => {
            const topLevelKeys = [
              "id",
              "name",
              "projectId",
              "ownerId",
              "team",
              "readyState",
              "status",
              "target",
              "url",
              "alias",
              "gitSource",
              "meta",
            ];
            if (!exactKeys(deployment, topLevelKeys)
              || !exactKeys(deployment.team, ["id", "slug"])
              || !exactKeys(deployment.gitSource, ["type", "repoId", "ref", "sha"])
              || !exactKeys(deployment.meta, [
                "githubOrg",
                "githubRepo",
                "githubCommitRef",
                "githubCommitSha",
              ])) {
              return false;
            }
            const metaKeys = [
              "githubOrg",
              "githubRepo",
              "githubCommitRef",
              "githubCommitSha",
            ];
            return isString(deployment.id)
              && /^dpl_[A-Za-z0-9]+$/.test(deployment.id)
              && isString(deployment.name)
              && isString(deployment.projectId)
              && isString(deployment.ownerId)
              && isString(deployment.team.id)
              && isString(deployment.team.slug)
              && isString(deployment.readyState)
              && isString(deployment.status)
              && deployment.target === null
              && isString(deployment.url)
              && Array.isArray(deployment.alias)
              && deployment.alias.every(isString)
              && isString(deployment.gitSource.type)
              && Number.isSafeInteger(deployment.gitSource.repoId)
              && isString(deployment.gitSource.ref)
              && isString(deployment.gitSource.sha)
              && metaKeys.every((key) => isString(deployment.meta[key]));
          };
          (async () => {
            const idOrUrl = encodeURIComponent(process.env.VERCEL_HOSTNAME);
            const endpoint = `https://api.vercel.com/v13/deployments/${idOrUrl}?teamId=team_i9xhhYXUeYBOCLcfWBjTqlYG`;
            const response = await fetch(endpoint, {
              method: "GET",
              headers: {
                Accept: "application/json",
                Authorization: `Bearer ${token}`,
              },
              redirect: "manual",
            });
            if (response.status < 200 || response.status >= 300) {
              fail();
            }
            const rawDeployment = JSON.parse(await response.text());
            const deployment = {
              id: rawDeployment?.id,
              name: rawDeployment?.name,
              projectId: rawDeployment?.projectId,
              ownerId: rawDeployment?.ownerId,
              team: {
                id: rawDeployment?.team?.id,
                slug: rawDeployment?.team?.slug,
              },
              readyState: rawDeployment?.readyState,
              status: rawDeployment?.status,
              target: rawDeployment?.target,
              url: rawDeployment?.url,
              alias: Array.isArray(rawDeployment?.alias)
                ? rawDeployment.alias.slice()
                : rawDeployment?.alias,
              gitSource: {
                type: rawDeployment?.gitSource?.type,
                repoId: rawDeployment?.gitSource?.repoId,
                ref: rawDeployment?.gitSource?.ref,
                sha: rawDeployment?.gitSource?.sha,
              },
              meta: {
                githubOrg: rawDeployment?.meta?.githubOrg,
                githubRepo: rawDeployment?.meta?.githubRepo,
                githubCommitRef: rawDeployment?.meta?.githubCommitRef,
                githubCommitSha: rawDeployment?.meta?.githubCommitSha,
              },
            };
            if (!validateDeploymentShape(deployment)
              || deployment.id === process.env.GITHUB_DEPLOYMENT_ID
              || deployment.id === process.env.GITHUB_DEPLOYMENT_STATUS_ID
              || deployment.name !== "aais"
              || deployment.projectId !== "prj_sKF9lhawVQyjxnv3jLyZvQH95Z1c"
              || deployment.ownerId !== "team_i9xhhYXUeYBOCLcfWBjTqlYG"
              || deployment.team.id !== "team_i9xhhYXUeYBOCLcfWBjTqlYG"
              || deployment.team.slug !== "peter-dongpin-hu-s-projects"
              || deployment.readyState !== "READY"
              || deployment.status !== "READY"
              || deployment.target !== null
              || !isString(deployment.url)
              || !Array.isArray(deployment.alias)
              || !deployment.alias.every(isString)
              || (deployment.url !== process.env.VERCEL_HOSTNAME
                && !deployment.alias.includes(process.env.VERCEL_HOSTNAME))
              || deployment.gitSource.type !== "github"
              || deployment.gitSource.repoId !== 1294583104
              || deployment.gitSource.ref !== "codex/aais-recovery-compose"
              || deployment.gitSource.sha !== process.env.ATTESTED_SHA
              || deployment.meta.githubOrg !== "HUDongpin"
              || deployment.meta.githubRepo !== "AAIS"
              || deployment.meta.githubCommitRef !== "codex/aais-recovery-compose"
              || deployment.meta.githubCommitSha !== process.env.ATTESTED_SHA) {
              fail();
            }
            const observedAt = new Date().toISOString();
            const VERCEL_DEPLOYMENT_ID = deployment.id;
            appendFileSync(process.env.GITHUB_OUTPUT, `vercel_deployment_id=${VERCEL_DEPLOYMENT_ID}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `provider_observed_at=${observedAt}\n`);
            console.log("AAIS_PREVIEW_TRUST_METADATA_PASS");
          })().catch(() => {
            console.error("AAIS_PREVIEW_TRUST_METADATA_RESPONSE");
            process.exit(1);
          });
          NODE

  preview-e2e:
    if: ${{ false }}
    needs: trust-preview
    runs-on: ubuntu-latest
    steps:
      - name: Stage C - checkout attested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.trust-preview.outputs.attested_sha }}

      - name: Verify exact checkout and repository
        env:
          ATTESTED_SHA: ${{ needs.trust-preview.outputs.attested_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$ATTESTED_SHA"
          origin="$(git remote get-url origin)"
          case "$origin" in
            https://github.com/HUDongpin/AAIS|https://github.com/HUDongpin/AAIS.git|git@github.com:HUDongpin/AAIS.git) ;;
            *) exit 1 ;;
          esac
          echo "AAIS_PREVIEW_TRUST_CHECKOUT_PASS"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against attested preview
        env:
          AAIS_E2E_BASE_URL: ${{ needs.trust-preview.outputs.vercel_origin }}
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: /dev/null
          AAIS_E2E_STUDENT_ACCOUNT: ${{ secrets.AAIS_E2E_STUDENT_ACCOUNT }}
          AAIS_E2E_STUDENT_PASSWORD: ${{ secrets.AAIS_E2E_STUDENT_PASSWORD }}
          AAIS_E2E_TEACHER_ACCOUNT: ${{ secrets.AAIS_E2E_TEACHER_ACCOUNT }}
          AAIS_E2E_TEACHER_PASSWORD: ${{ secrets.AAIS_E2E_TEACHER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$AAIS_E2E_STUDENT_ACCOUNT"
          test -n "$AAIS_E2E_STUDENT_PASSWORD"
          test -n "$AAIS_E2E_TEACHER_ACCOUNT"
          test -n "$AAIS_E2E_TEACHER_PASSWORD"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          npm run e2e

      - name: Verify no secret-bearing artifacts
        if: always()
        run: |
          artifact_file_count=0
          for directory in test-results playwright-report blob-report; do
            if test -d "$directory"; then
              count="$(find "$directory" -type f 2>/dev/null | wc -l | tr -d ' ')"
              artifact_file_count=$((artifact_file_count + count))
            fi
          done
          attachment_file_count=0
          if test -d test-results; then
            attachment_file_count="$(find test-results -type f -path '*/attachments/*' 2>/dev/null | wc -l | tr -d ' ')"
          fi
          echo "AAIS_PREVIEW_ARTIFACT_FILE_COUNT=$artifact_file_count"
          echo "AAIS_PREVIEW_ATTACHMENT_FILE_COUNT=$attachment_file_count"
          test "$artifact_file_count" -eq 0
          test "$attachment_file_count" -eq 0
