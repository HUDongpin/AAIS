name: AAIS Preview E2E

on:
  workflow_run:
    workflows: ["AAIS CI"]
    types: [completed]

permissions:
  contents: read
  deployments: read
  pull-requests: read
  actions: read

jobs:
  trust-preview:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      github_deployment_id: ${{ steps.github-trust.outputs.github_deployment_id }}
      github_deployment_status_id: ${{ steps.github-trust.outputs.github_deployment_status_id }}
      vercel_origin: ${{ steps.vercel-trust.outputs.vercel_origin }}
      vercel_hostname: ${{ steps.github-trust.outputs.vercel_hostname }}
      attested_sha: ${{ steps.github-trust.outputs.attested_sha }}
      repository: ${{ steps.github-trust.outputs.repository }}
      pull_number: ${{ steps.github-trust.outputs.pull_number }}
      ref: ${{ steps.github-trust.outputs.ref }}
      workflow_id: ${{ steps.github-trust.outputs.workflow_id }}
      workflow_path: ${{ steps.github-trust.outputs.workflow_path }}
      workflow_blob: ${{ steps.github-trust.outputs.workflow_blob }}
      main_sha: ${{ steps.github-trust.outputs.main_sha }}
      vercel_deployment_id: ${{ steps.vercel-trust.outputs.vercel_deployment_id }}
      provider_observed_at: ${{ steps.vercel-trust.outputs.provider_observed_at }}
    steps:
      - name: Stage A - attest GitHub deployment
        id: github-trust
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const OWNER = "HUDongpin";
            const REPO = "AAIS";
            const REPOSITORY = "HUDongpin/AAIS";
            const EVENT = "workflow_run";
            const DEFAULT_BRANCH = "main";
            const UPSTREAM_WORKFLOW = "AAIS CI";
            const UPSTREAM_WORKFLOW_PATH = ".github/workflows/ci.yml";
            const WORKFLOW_PATH = ".github/workflows/preview-e2e.yml";
            const WORKFLOW_REF = "HUDongpin/AAIS/.github/workflows/preview-e2e.yml@refs/heads/main";
            const OWNER_ACCOUNT = {
              login: "HUDongpin",
              id: 47708816,
              node_id: "MDQ6VXNlcjQ3NzA4ODE2",
              type: "User",
            };
            const executingWorkflowSha = process.env.GITHUB_WORKFLOW_SHA;
            const triggeringSha = process.env.GITHUB_SHA;
            const VERCEL_APP = {
              login: "vercel[bot]",
              id: 35613825,
              node_id: "MDM6Qm90MzU2MTM4MjU=",
              type: "Bot",
            };
            const fail = () => {
              throw new Error("AAIS_PREVIEW_TRUST_GITHUB");
            };
            const positiveId = (value) => Number.isSafeInteger(Number(value)) && Number(value) > 0;
            const isVercelApp = (actor) => actor
              && actor.login === VERCEL_APP.login
              && actor.id === VERCEL_APP.id
              && actor.node_id === VERCEL_APP.node_id
              && actor.type === VERCEL_APP.type;
            const isOwnerAccount = (actor) => actor
              && actor.login === OWNER_ACCOUNT.login
              && actor.id === OWNER_ACCOUNT.id
              && actor.node_id === OWNER_ACCOUNT.node_id
              && actor.type === OWNER_ACCOUNT.type;
            const normalizeVercelOrigin = (value) => {
              let url;
              try {
                url = new URL(value);
              } catch {
                fail();
              }
              if (url.protocol !== "https:"
                || url.port
                || url.username
                || url.password
                || url.pathname !== "/"
                || url.search
                || url.hash
                || !url.hostname.endsWith(".vercel.app")) {
                fail();
              }
              return { origin: url.origin, hostname: url.hostname };
            };

            if (context.eventName !== EVENT
              || `${context.repo.owner}/${context.repo.repo}` !== REPOSITORY
              || process.env.GITHUB_WORKFLOW_REF !== WORKFLOW_REF
              || !/^[a-f0-9]{40}$/.test(executingWorkflowSha)
              || triggeringSha !== executingWorkflowSha) {
              fail();
            }
            const eventWorkflowRun = context.payload.workflow_run;
            if (!positiveId(eventWorkflowRun?.id)
              || eventWorkflowRun?.event !== "pull_request"
              || eventWorkflowRun?.status !== "completed"
              || eventWorkflowRun?.conclusion !== "success"
              || !/^[a-f0-9]{40}$/.test(eventWorkflowRun?.head_sha)) {
              fail();
            }

            const { data: repository } = await github.rest.repos.get({ owner: OWNER, repo: REPO });
            const { data: workflowRun } = await github.rest.actions.getWorkflowRun({
              owner: OWNER,
              repo: REPO,
              run_id: Number(eventWorkflowRun.id),
            });
            const { data: workflow } = await github.rest.actions.getWorkflow({
              owner: OWNER,
              repo: REPO,
              workflow_id: "preview-e2e.yml",
            });
            const { data: workflowFile } = await github.rest.repos.getContent({
              owner: OWNER,
              repo: REPO,
              path: WORKFLOW_PATH,
              ref: executingWorkflowSha,
            });
            const { data: upstreamWorkflow } = await github.rest.actions.getWorkflow({
              owner: OWNER,
              repo: REPO,
              workflow_id: "ci.yml",
            });
            const candidateSha = eventWorkflowRun.head_sha;
            if (!/^[a-f0-9]{40}$/.test(candidateSha)) {
              fail();
            }
            const { data: trustedCiFile } = await github.rest.repos.getContent({
              owner: OWNER,
              repo: REPO,
              path: UPSTREAM_WORKFLOW_PATH,
              ref: executingWorkflowSha,
            });
            const { data: candidateCiFile } = await github.rest.repos.getContent({
              owner: OWNER,
              repo: REPO,
              path: UPSTREAM_WORKFLOW_PATH,
              ref: candidateSha,
            });
            const approvalCommand = `/aais-preview-e2e approve ${candidateSha}`;
            const resolvePullRequest = async () => {
              const associatedPullRequests = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner: OWNER,
                  repo: REPO,
                  commit_sha: candidateSha,
                  per_page: 100,
                },
              );
              if (!Array.isArray(associatedPullRequests)
                || associatedPullRequests.some((pull) => !positiveId(pull?.number))) {
                fail();
              }
              const pullRequests = await Promise.all(
                associatedPullRequests.map(async ({ number }) => {
                  const { data } = await github.rest.pulls.get({
                    owner: OWNER,
                    repo: REPO,
                    pull_number: Number(number),
                  });
                  return data;
                }),
              );
              const matchingPullRequests = pullRequests.filter((candidate) =>
                candidate?.state === "open"
                && candidate.base?.ref === DEFAULT_BRANCH
                && candidate.head?.repo?.full_name === REPOSITORY
                && candidate.head?.ref === eventWorkflowRun.head_branch
                && candidate.head?.sha === candidateSha);
              if (matchingPullRequests.length !== 1) {
                fail();
              }
              return matchingPullRequests[0];
            };
            const requireOwnerApproval = async (candidate) => {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: OWNER,
                  repo: REPO,
                  issue_number: Number(candidate.number),
                  per_page: 100,
                },
              );
              const ownerApprovals = comments.filter((comment) => positiveId(comment?.id)
                && comment.author_association === "OWNER"
                && isOwnerAccount(comment.user)
                && typeof comment.body === "string"
                && comment.body.trim() === approvalCommand);
              if (ownerApprovals.length < 1) {
                fail();
              }
            };
            let pullRequest = await resolvePullRequest();
            await requireOwnerApproval(pullRequest);

            let deployment;
            let deploymentStatus;
            for (let attempt = 0; attempt < 18; attempt += 1) {
              const deployments = await github.paginate(
                github.rest.repos.listDeployments,
                {
                  owner: OWNER,
                  repo: REPO,
                  sha: candidateSha,
                  environment: "Preview",
                  per_page: 100,
                },
              );
              const matchingDeployments = deployments
                .filter((candidate) => candidate?.sha === candidateSha
                  && candidate.environment === "Preview"
                  && isVercelApp(candidate.creator)
                  && (candidate.ref === pullRequest.head.ref
                    || candidate.ref === candidateSha))
                .sort((left, right) => Number(right.id) - Number(left.id));
              [deployment] = matchingDeployments;
              if (deployment) {
                const statuses = await github.paginate(
                  github.rest.repos.listDeploymentStatuses,
                  {
                    owner: OWNER,
                    repo: REPO,
                    deployment_id: Number(deployment.id),
                    per_page: 100,
                  },
                );
                [deploymentStatus] = statuses
                  .filter((status) => isVercelApp(status?.creator))
                  .sort((left, right) => Number(right.id) - Number(left.id));
                if (deploymentStatus?.state === "success") {
                  break;
                }
              }
              deployment = undefined;
              deploymentStatus = undefined;
              if (attempt < 17) {
                await new Promise((resolve) => setTimeout(resolve, 10000));
              }
            }
            const refreshedPullRequest = await resolvePullRequest();
            if (refreshedPullRequest.number !== pullRequest.number) {
              fail();
            }
            await requireOwnerApproval(refreshedPullRequest);
            pullRequest = refreshedPullRequest;

            if (repository.full_name !== REPOSITORY
              || repository.default_branch !== DEFAULT_BRANCH
              || workflowRun.id !== Number(eventWorkflowRun.id)
              || workflowRun.name !== UPSTREAM_WORKFLOW
              || workflowRun.path !== UPSTREAM_WORKFLOW_PATH
              || workflowRun.workflow_id !== upstreamWorkflow.id
              || workflowRun.event !== "pull_request"
              || workflowRun.status !== "completed"
              || workflowRun.conclusion !== "success"
              || workflowRun.head_sha !== candidateSha
              || workflowRun.head_branch !== pullRequest.head.ref
              || workflowRun.repository?.full_name !== REPOSITORY
              || workflowRun.head_repository?.full_name !== REPOSITORY
              || workflow.path !== WORKFLOW_PATH
              || workflow.state !== "active"
              || upstreamWorkflow.name !== UPSTREAM_WORKFLOW
              || upstreamWorkflow.path !== UPSTREAM_WORKFLOW_PATH
              || upstreamWorkflow.state !== "active"
              || Array.isArray(trustedCiFile)
              || trustedCiFile.type !== "file"
              || Array.isArray(candidateCiFile)
              || candidateCiFile.type !== "file"
              || typeof trustedCiFile.sha !== "string"
              || candidateCiFile.sha !== trustedCiFile.sha
              || Array.isArray(workflowFile)
              || workflowFile.type !== "file"
              || !positiveId(workflow.id)
              || typeof workflowFile.sha !== "string"
              || !positiveId(deployment?.id)
              || !positiveId(deploymentStatus?.id)
              || !isVercelApp(deployment.creator)
              || !isVercelApp(deploymentStatus.creator)
              || deployment.environment !== "Preview"
              || deploymentStatus.state !== "success"
              || !positiveId(pullRequest.number)
              || pullRequest.state !== "open"
              || pullRequest.base?.ref !== DEFAULT_BRANCH
              || pullRequest.head?.repo?.full_name !== REPOSITORY
              || pullRequest.head?.sha !== candidateSha
              || deployment.sha !== candidateSha
              || (deployment.ref !== pullRequest.head.ref
                && deployment.ref !== candidateSha)
              || !/^[a-f0-9]{40}$/.test(pullRequest.head.sha)) {
              fail();
            }
            const target = normalizeVercelOrigin(deploymentStatus.target_url);
            const environment = normalizeVercelOrigin(deploymentStatus.environment_url);
            if (target.origin !== environment.origin || target.hostname !== environment.hostname) {
              fail();
            }

            const GITHUB_DEPLOYMENT_ID = String(deployment.id);
            const GITHUB_DEPLOYMENT_STATUS_ID = String(deploymentStatus.id);
            const ATTESTED_SHA = pullRequest.head.sha;
            const VERCEL_HOSTNAME = target.hostname;
            core.setOutput("github_deployment_id", GITHUB_DEPLOYMENT_ID);
            core.setOutput("github_deployment_status_id", GITHUB_DEPLOYMENT_STATUS_ID);
            core.setOutput("vercel_origin", target.origin);
            core.setOutput("vercel_hostname", VERCEL_HOSTNAME);
            core.setOutput("attested_sha", ATTESTED_SHA);
            core.setOutput("repository", REPOSITORY);
            core.setOutput("pull_number", String(pullRequest.number));
            core.setOutput("ref", pullRequest.head.ref);
            core.setOutput("workflow_id", String(workflow.id));
            core.setOutput("workflow_path", WORKFLOW_PATH);
            core.setOutput("workflow_blob", workflowFile.sha);
            core.setOutput("main_sha", executingWorkflowSha);
            console.log("AAIS_PREVIEW_TRUST_GITHUB_PASS");

      - name: Stage B - attest Vercel deployment
        id: vercel-trust
        env:
          VERCEL_E2E_METADATA_TOKEN: ${{ secrets.VERCEL_E2E_METADATA_TOKEN }}
          VERCEL_HOSTNAME: ${{ steps.github-trust.outputs.vercel_hostname }}
          ATTESTED_SHA: ${{ steps.github-trust.outputs.attested_sha }}
          ATTESTED_REF: ${{ steps.github-trust.outputs.ref }}
          GITHUB_DEPLOYMENT_ID: ${{ steps.github-trust.outputs.github_deployment_id }}
          GITHUB_DEPLOYMENT_STATUS_ID: ${{ steps.github-trust.outputs.github_deployment_status_id }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const token = process.env.VERCEL_E2E_METADATA_TOKEN;
          if (!token) {
            console.error("AAIS_PREVIEW_TRUST_METADATA_TOKEN_ABSENT");
            process.exit(1);
          }
          const fail = () => {
            throw new Error("AAIS_PREVIEW_TRUST_METADATA_RESPONSE");
          };
          const isString = (value) => typeof value === "string" && value.length > 0;
          const isObject = (value) => value !== null
            && typeof value === "object"
            && !Array.isArray(value);
          const hasOwn = (value, key) => Object.prototype.hasOwnProperty.call(value, key);
          const exactKeys = (value, keys) => isObject(value)
            && Object.keys(value).length === keys.length
            && keys.every((key) => hasOwn(value, key));
          const validateDeploymentShape = (deployment) => {
            const topLevelKeys = [
              "id",
              "name",
              "projectId",
              "ownerId",
              "team",
              "readyState",
              "status",
              "target",
              "url",
              "alias",
              "gitSource",
              "meta",
            ];
            if (!exactKeys(deployment, topLevelKeys)
              || !exactKeys(deployment.team, ["id", "slug"])
              || !exactKeys(deployment.gitSource, ["type", "repoId", "ref", "sha"])
              || !exactKeys(deployment.meta, [
                "githubOrg",
                "githubRepo",
                "githubCommitRef",
                "githubCommitSha",
              ])) {
              return false;
            }
            const metaKeys = [
              "githubOrg",
              "githubRepo",
              "githubCommitRef",
              "githubCommitSha",
            ];
            return isString(deployment.id)
              && /^dpl_[A-Za-z0-9]+$/.test(deployment.id)
              && isString(deployment.name)
              && isString(deployment.projectId)
              && isString(deployment.ownerId)
              && isString(deployment.team.id)
              && isString(deployment.team.slug)
              && isString(deployment.readyState)
              && isString(deployment.status)
              && deployment.target === null
              && isString(deployment.url)
              && Array.isArray(deployment.alias)
              && deployment.alias.every(isString)
              && isString(deployment.gitSource.type)
              && Number.isSafeInteger(deployment.gitSource.repoId)
              && isString(deployment.gitSource.ref)
              && isString(deployment.gitSource.sha)
              && metaKeys.every((key) => isString(deployment.meta[key]));
          };
          (async () => {
            const idOrUrl = encodeURIComponent(process.env.VERCEL_HOSTNAME);
            const endpoint = `https://api.vercel.com/v13/deployments/${idOrUrl}?teamId=team_i9xhhYXUeYBOCLcfWBjTqlYG`;
            const response = await fetch(endpoint, {
              method: "GET",
              headers: {
                Accept: "application/json",
                Authorization: `Bearer ${token}`,
              },
              redirect: "manual",
            });
            if (response.status < 200 || response.status >= 300) {
              fail();
            }
            const rawDeployment = JSON.parse(await response.text());
            const deployment = {
              id: rawDeployment?.id,
              name: rawDeployment?.name,
              projectId: rawDeployment?.projectId,
              ownerId: rawDeployment?.ownerId,
              team: {
                id: rawDeployment?.team?.id,
                slug: rawDeployment?.team?.slug,
              },
              readyState: rawDeployment?.readyState,
              status: rawDeployment?.status,
              target: rawDeployment?.target,
              url: rawDeployment?.url,
              alias: Array.isArray(rawDeployment?.alias)
                ? rawDeployment.alias.slice()
                : rawDeployment?.alias,
              gitSource: {
                type: rawDeployment?.gitSource?.type,
                repoId: rawDeployment?.gitSource?.repoId,
                ref: rawDeployment?.gitSource?.ref,
                sha: rawDeployment?.gitSource?.sha,
              },
              meta: {
                githubOrg: rawDeployment?.meta?.githubOrg,
                githubRepo: rawDeployment?.meta?.githubRepo,
                githubCommitRef: rawDeployment?.meta?.githubCommitRef,
                githubCommitSha: rawDeployment?.meta?.githubCommitSha,
              },
            };
            if (!validateDeploymentShape(deployment)
              || deployment.id === process.env.GITHUB_DEPLOYMENT_ID
              || deployment.id === process.env.GITHUB_DEPLOYMENT_STATUS_ID
              || deployment.name !== "aais"
              || deployment.projectId !== "prj_sKF9lhawVQyjxnv3jLyZvQH95Z1c"
              || deployment.ownerId !== "team_i9xhhYXUeYBOCLcfWBjTqlYG"
              || deployment.team.id !== "team_i9xhhYXUeYBOCLcfWBjTqlYG"
              || deployment.team.slug !== "peter-dongpin-hu-s-projects"
              || deployment.readyState !== "READY"
              || deployment.status !== "READY"
              || deployment.target !== null
              || !isString(deployment.url)
              || !Array.isArray(deployment.alias)
              || !deployment.alias.every(isString)
              || deployment.url !== process.env.VERCEL_HOSTNAME
              || deployment.gitSource.type !== "github"
              || deployment.gitSource.repoId !== 1294583104
              || deployment.gitSource.ref !== process.env.ATTESTED_REF
              || deployment.gitSource.sha !== process.env.ATTESTED_SHA
              || deployment.meta.githubOrg !== "HUDongpin"
              || deployment.meta.githubRepo !== "AAIS"
              || deployment.meta.githubCommitRef !== process.env.ATTESTED_REF
              || deployment.meta.githubCommitSha !== process.env.ATTESTED_SHA) {
              fail();
            }
            const observedAt = new Date().toISOString();
            const VERCEL_DEPLOYMENT_ID = deployment.id;
            const VERCEL_ORIGIN = `https://${deployment.url}`;
            appendFileSync(process.env.GITHUB_OUTPUT, `vercel_deployment_id=${VERCEL_DEPLOYMENT_ID}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `provider_observed_at=${observedAt}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `vercel_origin=${VERCEL_ORIGIN}\n`);
            console.log("AAIS_PREVIEW_TRUST_METADATA_PASS");
          })().catch(() => {
            console.error("AAIS_PREVIEW_TRUST_METADATA_RESPONSE");
            process.exit(1);
          });
          NODE

  preview-e2e:
    needs: trust-preview
    runs-on: ubuntu-latest
    steps:
      - name: Stage C - checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.trust-preview.outputs.main_sha }}

      - name: Verify exact checkout and repository
        env:
          TRUSTED_MAIN_SHA: ${{ needs.trust-preview.outputs.main_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TRUSTED_MAIN_SHA"
          origin="$(git remote get-url origin)"
          case "$origin" in
            https://github.com/HUDongpin/AAIS|https://github.com/HUDongpin/AAIS.git|git@github.com:HUDongpin/AAIS.git) ;;
            *) exit 1 ;;
          esac
          echo "AAIS_PREVIEW_TRUST_CHECKOUT_PASS"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against attested preview
        env:
          AAIS_E2E_BASE_URL: ${{ needs.trust-preview.outputs.vercel_origin }}
          PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: /dev/null
          AAIS_E2E_STUDENT_ACCOUNT: ${{ secrets.AAIS_E2E_STUDENT_ACCOUNT }}
          AAIS_E2E_STUDENT_PASSWORD: ${{ secrets.AAIS_E2E_STUDENT_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$AAIS_E2E_STUDENT_ACCOUNT"
          test -n "$AAIS_E2E_STUDENT_PASSWORD"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          npm run e2e -- --grep-invert "teacher|core screens|persists after reload"

      - name: Verify no secret-bearing artifacts
        if: always()
        run: |
          rm -rf test-results playwright-report blob-report
          artifact_file_count=0
          for directory in test-results playwright-report blob-report; do
            if test -d "$directory"; then
              count="$(find "$directory" -type f 2>/dev/null | wc -l | tr -d ' ')"
              artifact_file_count=$((artifact_file_count + count))
            fi
          done
          attachment_file_count=0
          if test -d test-results; then
            attachment_file_count="$(find test-results -type f -path '*/attachments/*' 2>/dev/null | wc -l | tr -d ' ')"
          fi
          echo "AAIS_PREVIEW_ARTIFACT_FILE_COUNT=$artifact_file_count"
          echo "AAIS_PREVIEW_ATTACHMENT_FILE_COUNT=$attachment_file_count"
          test "$artifact_file_count" -eq 0
          test "$attachment_file_count" -eq 0
