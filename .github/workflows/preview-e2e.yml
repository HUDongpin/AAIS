name: AAIS Preview E2E

on:
  deployment_status:

permissions:
  contents: read

jobs:
  preview-e2e:
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview' &&
      startsWith(github.event.deployment_status.target_url, 'https://')
    runs-on: ubuntu-latest
    env:
      AAIS_E2E_BASE_URL: ${{ github.event.deployment_status.target_url }}
      AAIS_E2E_STUDENT_ACCOUNT: ${{ secrets.AAIS_E2E_STUDENT_ACCOUNT }}
      AAIS_E2E_STUDENT_PASSWORD: ${{ secrets.AAIS_E2E_STUDENT_PASSWORD }}
      AAIS_E2E_TEACHER_ACCOUNT: ${{ secrets.AAIS_E2E_TEACHER_ACCOUNT }}
      AAIS_E2E_TEACHER_PASSWORD: ${{ secrets.AAIS_E2E_TEACHER_PASSWORD }}
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify preview E2E credentials
        run: |
          test -n "$AAIS_E2E_STUDENT_ACCOUNT"
          test -n "$AAIS_E2E_STUDENT_PASSWORD"
          test -n "$AAIS_E2E_TEACHER_ACCOUNT"
          test -n "$AAIS_E2E_TEACHER_PASSWORD"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against preview deployment
        run: npm run e2e
